name: medmap_mobile
description: MedMap mobile app for real-time healthcare facility routing
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # Geolocation
  geolocator: ^10.0.0
  
  # Map
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  
  # JSON Serialization
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0
  
  # Architecture & Utilities
  get_it: ^7.5.0
  
  # Date/Time
  intl: ^0.19.0
  
  # DevDependencies
  flutter_lints: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
  
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
          weight: 400
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
