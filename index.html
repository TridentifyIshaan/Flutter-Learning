<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedMap — Clinical Routing Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-void:    #080c10;
      --bg-deep:    #0c1118;
      --bg-panel:   #111820;
      --bg-card:    #161e28;
      --bg-hover:   #1c2736;
      --border:     #1e2d3d;
      --border-hi:  #2a3f56;
      --teal:       #00d4aa;
      --teal-dim:   #00a882;
      --teal-glow:  rgba(0,212,170,0.15);
      --amber:      #f5a623;
      --amber-dim:  rgba(245,166,35,0.15);
      --red:        #ff4d6a;
      --red-dim:    rgba(255,77,106,0.12);
      --blue:       #4d9fff;
      --blue-dim:   rgba(77,159,255,0.12);
      --purple:     #a78bfa;
      --text-bright:#e8f0f7;
      --text-main:  #8fa3b8;
      --text-muted: #445566;
      --text-faint: #2a3a4a;
      --font-head:  'Syne', sans-serif;
      --font-body:  'DM Sans', sans-serif;
      --font-mono:  'DM Mono', monospace;
      --radius-sm:  6px;
      --radius:     10px;
      --radius-lg:  16px;
      --shadow:     0 4px 24px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg-void);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TOPBAR ── */
    #topbar {
      height: 58px;
      background: var(--bg-deep);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 16px;
      flex-shrink: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 17px;
      color: var(--text-bright);
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .logo-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--teal), #007a63);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .logo span { color: var(--teal); }
    .topbar-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

    #search-bar {
      flex: 1;
      max-width: 360px;
      position: relative;
    }
    #search-bar input {
      width: 100%;
      height: 34px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-bright);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 0 12px 0 34px;
      outline: none;
      transition: border-color .2s;
    }
    #search-bar input::placeholder { color: var(--text-muted); }
    #search-bar input:focus { border-color: var(--border-hi); }
    #search-bar .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;
    }

    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
    }
    .pulse-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      animation: pulse-anim 2s ease-in-out infinite;
    }
    .pulse-dot.green { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
    .pulse-dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    @keyframes pulse-anim {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:.5; transform:scale(0.8); }
    }

    .btn-locate {
      height: 34px;
      padding: 0 14px;
      background: var(--teal-glow);
      border: 1px solid var(--teal-dim);
      border-radius: var(--radius-sm);
      color: var(--teal);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
    }
    .btn-locate:hover {
      background: rgba(0,212,170,0.25);
      box-shadow: 0 0 12px var(--teal-glow);
    }

    /* ── MAIN LAYOUT ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── LEFT SIDEBAR ── */
    #sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Filters */
    .filter-group { display: flex; flex-direction: column; gap: 8px; }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-main);
    }
    .filter-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }

    .toggle {
      width: 32px; height: 18px;
      background: var(--bg-void);
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--teal-glow); border-color: var(--teal); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      background: var(--text-muted);
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: left .2s, background .2s;
    }
    .toggle.on::after { left: 16px; background: var(--teal); }

    .tag-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Specialty chips */
    .chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 4px 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: all .15s;
    }
    .chip:hover { border-color: var(--border-hi); color: var(--text-bright); }
    .chip.active { background: var(--teal-glow); border-color: var(--teal); color: var(--teal); }

    /* Sort bar */
    .sort-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sort-btn {
      padding: 4px 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
    }
    .sort-btn.active {
      background: var(--bg-hover);
      border-color: var(--border-hi);
      color: var(--text-bright);
    }
    .sort-label { font-size: 11px; font-family: var(--font-mono); color: var(--text-faint); margin-right: 4px; }
    .result-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Facility list */
    #facility-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    #facility-list::-webkit-scrollbar { width: 4px; }
    #facility-list::-webkit-scrollbar-track { background: transparent; }
    #facility-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .facility-card {
      padding: 12px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all .15s;
      position: relative;
    }
    .facility-card:hover { background: var(--bg-hover); }
    .facility-card.active {
      background: var(--bg-hover);
      border-left-color: var(--teal);
    }
    .fc-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .fc-name {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      line-height: 1.3;
    }
    .fc-type-badge {
      font-size: 9px;
      font-family: var(--font-mono);
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-hospital { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,77,106,0.3); }
    .badge-clinic   { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(77,159,255,0.3); }
    .badge-mobile   { background: var(--teal-glow); color: var(--teal); border: 1px solid rgba(0,212,170,0.3); }
    .badge-pharma   { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,166,35,0.3); }

    .fc-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .fc-meta-item { display: flex; align-items: center; gap: 4px; font-size: 11px; font-family: var(--font-mono); }
    .fc-dist { color: var(--teal); }
    .fc-wait { }
    .wait-low    { color: #4ade80; }
    .wait-medium { color: var(--amber); }
    .wait-high   { color: var(--red); }
    .fc-rating { color: var(--amber); }
    .fc-open { color: #4ade80; font-size: 10px; }
    .fc-closed { color: var(--red); font-size: 10px; }

    /* ── MAP CONTAINER ── */
    #map-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #map { width: 100%; height: 100%; }

    /* Map overlay controls */
    .map-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .map-ctrl-btn {
      width: 36px; height: 36px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all .15s;
      box-shadow: var(--shadow);
    }
    .map-ctrl-btn:hover { background: var(--bg-hover); color: var(--text-bright); border-color: var(--border-hi); }

    .map-layer-toggle {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      display: flex;
      gap: 6px;
    }
    .layer-btn {
      height: 30px;
      padding: 0 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: all .15s;
      box-shadow: var(--shadow);
    }
    .layer-btn.on { background: var(--teal-glow); border-color: var(--teal); color: var(--teal); }
    .layer-btn:hover { border-color: var(--border-hi); }

    /* Stats bar at bottom of map */
    .map-stats {
      position: absolute;
      bottom: 14px;
      left: 14px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }
    .stat-chip {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-main);
      display: flex; align-items: center; gap: 6px;
      box-shadow: var(--shadow);
    }
    .stat-chip .val {
      font-size: 15px;
      font-weight: 500;
      font-family: var(--font-head);
      color: var(--text-bright);
    }

    /* ── DETAIL PANEL ── */
    #detail-panel {
      width: 320px;
      min-width: 320px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    #detail-panel.open { transform: translateX(0); }

    .dp-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .dp-close {
      margin-left: auto;
      width: 26px; height: 26px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .dp-icon {
      width: 42px; height: 42px;
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .dp-icon.hospital { background: var(--red-dim); }
    .dp-icon.clinic   { background: var(--blue-dim); }
    .dp-icon.mobile   { background: var(--teal-glow); }
    .dp-icon.pharma   { background: var(--amber-dim); }

    .dp-title {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-bright);
      line-height: 1.3;
    }
    .dp-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .dp-body { flex: 1; overflow-y: auto; padding: 0; }
    .dp-body::-webkit-scrollbar { width: 4px; }
    .dp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .dp-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .dp-section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .info-cell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .info-cell-label { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 4px; }
    .info-cell-val { font-size: 14px; font-family: var(--font-head); font-weight: 600; color: var(--text-bright); }
    .info-cell-val.teal { color: var(--teal); }
    .info-cell-val.amber { color: var(--amber); }
    .info-cell-val.red { color: var(--red); }
    .info-cell-val.green { color: #4ade80; }

    .specialty-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .spec-tag {
      padding: 3px 8px;
      font-size: 10px;
      font-family: var(--font-mono);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
    }

    .wait-bar-wrap { margin-top: 6px; }
    .wait-bar-label { display: flex; justify-content: space-between; font-size: 11px; font-family: var(--font-mono); margin-bottom: 5px; }
    .wait-bar-bg {
      height: 6px;
      background: var(--bg-void);
      border-radius: 3px;
      overflow: hidden;
    }
    .wait-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .6s ease;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-top: 6px;
    }
    .route-icon { font-size: 20px; }
    .route-details { flex: 1; }
    .route-time { font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text-bright); }
    .route-dist-label { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }

    .btn-navigate {
      width: 100%;
      height: 40px;
      background: linear-gradient(135deg, var(--teal), #007a63);
      border: none;
      border-radius: var(--radius);
      color: var(--bg-void);
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .2s;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .btn-navigate:hover { filter: brightness(1.15); box-shadow: 0 0 20px rgba(0,212,170,0.3); }

    .btn-secondary {
      width: 100%;
      height: 36px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .15s;
      margin-top: 6px;
    }
    .btn-secondary:hover { background: var(--bg-hover); color: var(--text-bright); border-color: var(--border-hi); }

    /* Leaflet custom overrides */
    .leaflet-container { background: #080c10 !important; }
    .leaflet-control-zoom { display: none; }
    .leaflet-popup-content-wrapper {
      background: var(--bg-panel) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      color: var(--text-main) !important;
    }
    .leaflet-popup-tip { background: var(--bg-panel) !important; }
    .leaflet-popup-close-button { color: var(--text-muted) !important; }

    .custom-popup h3 {
      font-family: var(--font-head);
      font-size: 14px;
      color: var(--text-bright);
      margin-bottom: 5px;
    }
    .custom-popup p { font-size: 12px; line-height: 1.5; }
    .custom-popup .pop-meta { display: flex; gap: 10px; margin-top: 6px; font-family: var(--font-mono); font-size: 11px; }
    .custom-popup .pop-btn {
      margin-top: 10px;
      width: 100%;
      padding: 7px;
      background: var(--teal-glow);
      border: 1px solid var(--teal-dim);
      border-radius: var(--radius-sm);
      color: var(--teal);
      font-size: 12px;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background .15s;
    }
    .custom-popup .pop-btn:hover { background: rgba(0,212,170,0.25); }

    /* Mobile unit pulse animation */
    @keyframes mobile-pulse {
      0%   { transform: scale(1);   opacity: 1; }
      50%  { transform: scale(1.4); opacity: 0.4; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .mobile-pulse-ring {
      width: 30px; height: 30px;
      border: 2px solid var(--teal);
      border-radius: 50%;
      animation: mobile-pulse 2s ease-in-out infinite;
    }

    /* No facilities message */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }
    .empty-state .big-icon { font-size: 28px; opacity: 0.4; }

    /* Scrollbar global */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Responsive tweaks */
    @media (max-width: 900px) {
      #sidebar { width: 260px; min-width: 260px; }
      #detail-panel { width: 280px; min-width: 280px; }
    }
    @media (max-width: 700px) {
      #sidebar { display: none; }
      #detail-panel { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; z-index: 500; }
    }
  </style>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<div id="topbar">
  <div class="logo">
    <div class="logo-icon">✚</div>
    Med<span>Map</span>
  </div>
  <div class="topbar-sep"></div>
  <div id="search-bar">
    <span class="search-icon">⌕</span>
    <input type="text" placeholder="Search facilities, specialties, areas…" id="search-input" />
  </div>
  <div class="topbar-right">
    <div class="status-pill">
      <span class="pulse-dot green"></span>
      <span>Live Data</span>
    </div>
    <div class="status-pill">
      <span class="pulse-dot amber"></span>
      <span id="mobile-count">4 Units Active</span>
    </div>
    <button class="btn-locate" onclick="locateUser()">
      ◎ My Location
    </button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div id="main">

  <!-- ── SIDEBAR ── -->
  <div id="sidebar">

    <!-- Filters -->
    <div class="sidebar-section">

function resolveApiBaseUrl() {
  const qpBase = new URLSearchParams(window.location.search).get('apiBase');
  if (qpBase) {
    return qpBase.replace(/\/$/, '');
  }

  const { protocol, hostname } = window.location;
  if (hostname === 'localhost' || hostname === '127.0.0.1') {
    return 'http://localhost:3000';
  }

  return `${protocol}//${hostname.replace('-8080.', '-3000.')}`;
}

function mapApiFacility(item) {
  const lat = Number.parseFloat(item.latitude);
  const lng = Number.parseFloat(item.longitude);
  const rating = Number.parseFloat(item.rating);
  const beds = item.beds == null ? null : Number(item.beds);
  const deterministicWait = 5 + (Number(item.id) % 55);

  return {
    id: item.id,
    type: item.type,
    name: item.name,
    address: item.address,
    lat: Number.isFinite(lat) ? lat : 28.5700,
    lng: Number.isFinite(lng) ? lng : 77.2100,
    specialty: Array.isArray(item.specialties) && item.specialties.length ? item.specialties : ['General'],
    waitTime: deterministicWait,
    rating: Number.isFinite(rating) ? rating : 4.0,
    beds,
    open: Boolean(item.is_open),
    phone: item.phone || 'N/A',
    distance: null,
    routeTime: null,
    desc: item.description || 'Healthcare facility',
  };
}

async function loadFacilitiesFromApi() {
  const apiBase = resolveApiBaseUrl();
  const response = await fetch(`${apiBase}/api/v1/facilities`, {
    headers: { 'Accept': 'application/json' },
  });

  if (!response.ok) {
    throw new Error(`Facilities API failed: ${response.status}`);
  }

  const payload = await response.json();
  if (!Array.isArray(payload)) {
    throw new Error('Facilities API response is not an array');
  }

  FACILITIES = payload.map(mapApiFacility);
}

function makeIcon(type, size=28) {

// ══ MOBILE UNIT ANIMATION ══
let mobileOffsets = {};

function rebuildMobileOffsets() {
  mobileOffsets = {};
  FACILITIES.filter(f=>f.type==='mobile').forEach(f=>{
    mobileOffsets[f.id] = {dx:0,dy:0,dxDir:Math.random()>0.5?1:-1,dyDir:Math.random()>0.5?1:-1};
  });
}

function animateMobileUnits() {
  setInterval(()=>{
    FACILITIES.filter(f=>f.type==='mobile' && f.open).forEach(f=>{
      const o = mobileOffsets[f.id];
      o.dx += o.dxDir * 0.0003;
      o.dy += o.dyDir * 0.0003;
      if(Math.abs(o.dx)>0.004) o.dxDir*=-1;
      if(Math.abs(o.dy)>0.004) o.dyDir*=-1;
      const m = facilityMarkers[f.id];
      if(m) m.setLatLng([f.lat+o.dy, f.lng+o.dx]);
    });
  }, 1500);
}

// ══ USER LOCATION ══
function locateUser() {
  if(!navigator.geolocation){ alert('Geolocation not supported'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    userLatLng = [pos.coords.latitude, pos.coords.longitude];
    if(userMarker) map.removeLayer(userMarker);
    userMarker = L.marker(userLatLng, {icon:userIcon()}).addTo(map);
    map.setView(userLatLng, 13);
    calcDistances();
    renderFacilityList();
    document.getElementById('stat-nearest').textContent = getNearestDist();
  }, ()=>{
    // Fallback to Delhi center
    userLatLng = [28.5700, 77.2100];
    calcDistances();
    renderFacilityList();
  });
}

function haversine(a, b) {
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function calcDistances() {
  if(!userLatLng) return;
  FACILITIES.forEach(f=>{
    f.distance = haversine(userLatLng,[f.lat,f.lng]);
    f.routeTime = Math.round(f.distance / 0.4 + f.distance * 0.5 + Math.random()*3);
  });
}

function getNearestDist() {
  if(!userLatLng) return '—';
  const sorted = [...FACILITIES].filter(f=>f.distance!=null).sort((a,b)=>a.distance-b.distance);
  return sorted[0] ? sorted[0].distance.toFixed(1)+'km' : '—';
}

function toggleFilter(type, el) {
  activeFilters[type] = !activeFilters[type];
  el.classList.toggle('on', activeFilters[type]);
  FACILITIES.forEach(f=>{
    if(f.type===type) {
      const m = facilityMarkers[f.id];
      if(m) activeFilters[type] ? m.addTo(map) : map.removeLayer(m);
    }
  });
  renderFacilityList();
}

function filterSpecialty(el, spec) {
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  activeSpecialty = spec;
  renderFacilityList();
}

function sortFacilities(by, el) {
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  sortBy = by;
  renderFacilityList();
}

function getFilteredFacilities() {
  let list = FACILITIES.filter(f => activeFilters[f.type]);
  if(activeSpecialty !== 'all') list = list.filter(f=>f.specialty.includes(activeSpecialty));
  if(searchQuery) list = list.filter(f=>
    f.name.toLowerCase().includes(searchQuery) ||
    f.address.toLowerCase().includes(searchQuery) ||
    f.specialty.some(s=>s.toLowerCase().includes(searchQuery))
  );
  list.sort((a,b)=>{
    if(sortBy==='distance') return (a.distance??999)-(b.distance??999);
    if(sortBy==='wait') return a.waitTime-b.waitTime;
    if(sortBy==='rating') return b.rating-a.rating;
    return 0;
  });
  return list;
}

// ══ RENDER LIST ══
function renderFacilityList() {
  const list = getFilteredFacilities();
  const el = document.getElementById('facility-list');
  document.getElementById('result-count').textContent = list.length+' results';
  document.getElementById('stat-facilities').textContent = list.length;
  const mobileCount = list.filter(f=>f.type==='mobile').length;
  document.getElementById('stat-mobile').textContent = mobileCount;
  document.getElementById('mobile-count').textContent = mobileCount + ' Units Active';

  if(!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div><div>No facilities match current filters.</div></div>`;
    return;
  }

  el.innerHTML = list.map(f=>{
    const waitClass = f.waitTime<20?'wait-low':f.waitTime<45?'wait-medium':'wait-high';
    const badgeClass = 'badge-'+f.type;
    const distStr = f.distance!=null ? f.distance.toFixed(1)+'km' : '—';
    const badgeLabel = {hospital:'HOSPITAL',clinic:'CLINIC',mobile:'MOBILE',pharma:'PHARMACY'}[f.type];
    return `<div class="facility-card${activeFacilityId===f.id?' active':''}" onclick="openDetail(${f.id})">
      <div class="fc-header">
        <div class="fc-name">${f.name}</div>
        <div class="fc-type-badge ${badgeClass}">${badgeLabel}</div>
      </div>
      <div class="fc-meta">
        <span class="fc-meta-item fc-dist">◎ ${distStr}</span>
        <span class="fc-meta-item fc-wait ${waitClass}">⏱ ${f.waitTime}m</span>
        <span class="fc-meta-item fc-rating">★ ${f.rating}</span>
        <span class="fc-meta-item ${f.open?'fc-open':'fc-closed'}">${f.open?'● Open':'● Closed'}</span>
      </div>
    </div>`;
  }).join('');
}

// ══ DETAIL PANEL ══
function openDetail(id) {
  const f = FACILITIES.find(x=>x.id===id);
  if(!f) return;
  activeFacilityId = id;

  // Update active state in list
  document.querySelectorAll('.facility-card').forEach(c=>c.classList.remove('active'));
  const cards = document.querySelectorAll('.facility-card');
  // Re-render to update active class
  renderFacilityList();

  // Pan map to facility
  map.setView([f.lat, f.lng], 14);
  facilityMarkers[f.id]?.openPopup();

  // Draw mock route
  drawMockRoute(f);

  // Fill panel
  const icons = {hospital:'🏥',clinic:'🩺',mobile:'🚑',pharma:'💊'};
  const iconEl = document.getElementById('dp-icon');
  iconEl.textContent = icons[f.type];
  iconEl.className = `dp-icon ${f.type}`;
  document.getElementById('dp-name').textContent = f.name;
  document.getElementById('dp-subtitle').textContent = f.address;

  const waitColor = f.waitTime<20?'green':f.waitTime<45?'amber':'red';
  const waitBarPct = Math.min(100, (f.waitTime/90)*100);
  const waitBarColor = f.waitTime<20?'#4ade80':f.waitTime<45?'#f5a623':'#ff4d6a';
  const distStr = f.distance!=null?f.distance.toFixed(1)+' km':'—';
  const timeStr = f.routeTime!=null?f.routeTime+' min':'—';
  const bedsStr = f.beds ? f.beds.toLocaleString() : 'N/A';

  const specs = f.specialty.map(s=>`<span class="spec-tag">${s}</span>`).join('');

  document.getElementById('dp-body').innerHTML = `
    <div class="dp-section">
      <div class="dp-section-title">Quick Stats</div>
      <div class="info-grid">
        <div class="info-cell">
          <div class="info-cell-label">WAIT TIME</div>
          <div class="info-cell-val ${waitColor}">${f.waitTime} min</div>
        </div>
        <div class="info-cell">
          <div class="info-cell-label">RATING</div>
          <div class="info-cell-val amber">★ ${f.rating}</div>
        </div>
        <div class="info-cell">
          <div class="info-cell-label">DISTANCE</div>
          <div class="info-cell-val teal">${distStr}</div>
        </div>
        <div class="info-cell">
          <div class="info-cell-label">STATUS</div>
          <div class="info-cell-val ${f.open?'green':'red'}">${f.open?'Open':'Closed'}</div>
        </div>
        ${f.beds?`<div class="info-cell" style="grid-column:span 2">
          <div class="info-cell-label">TOTAL BEDS</div>
          <div class="info-cell-val">${bedsStr}</div>
        </div>`:''}
      </div>
    </div>

    <div class="dp-section">
      <div class="dp-section-title">Specialties</div>
      <div class="specialty-list">${specs}</div>
    </div>

    <div class="dp-section">
      <div class="dp-section-title">Live Wait Time</div>
      <div class="wait-bar-wrap">
        <div class="wait-bar-label">
          <span>Current Queue</span>
          <span style="color:${waitBarColor}">${f.waitTime} min</span>
        </div>
        <div class="wait-bar-bg">
          <div class="wait-bar-fill" style="width:${waitBarPct}%;background:${waitBarColor};"></div>
        </div>
      </div>
    </div>

    <div class="dp-section">
      <div class="dp-section-title">Routing</div>
      ${userLatLng ? `
      <div class="route-info">
        <span class="route-icon">🚗</span>
        <div class="route-details">
          <div class="route-time">${timeStr}</div>
          <div class="route-dist-label">${distStr} • via fastest route</div>
        </div>
      </div>` : `<p style="font-size:12px;color:var(--text-muted)">Enable location to see routing.</p>`}
      <button class="btn-navigate" onclick="startNavigation(${f.id})">
        ↗ Start Navigation
      </button>
      <button class="btn-secondary" onclick="callFacility('${f.phone}')">
        📞 ${f.phone}
      </button>
    </div>

    <div class="dp-section">
      <div class="dp-section-title">About</div>
      <p style="font-size:12.5px;line-height:1.6;color:var(--text-main)">${f.desc}</p>
    </div>
  `;

  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  activeFacilityId = null;
  clearRoute();
  renderFacilityList();
}

// ══ MOCK ROUTE ══
function drawMockRoute(f) {
  clearRoute();
  if(!userLatLng) return;
  const start = L.latLng(userLatLng[0], userLatLng[1]);
  const end   = L.latLng(f.lat, f.lng);
  // Bezier-like intermediate point
  const midLat = (start.lat+end.lat)/2 + (Math.random()-0.5)*0.02;
  const midLng = (start.lng+end.lng)/2 + (Math.random()-0.5)*0.02;
  const pts = [start, L.latLng(midLat, midLng), end];
  routeLayer = L.polyline(pts, {
    color:'#00d4aa', weight:3, opacity:0.75,
    dashArray:'8, 6', lineCap:'round'
  }).addTo(map);
  map.fitBounds(routeLayer.getBounds(), {padding:[60,60]});
}

function clearRoute() {
  if(routeLayer) { map.removeLayer(routeLayer); routeLayer=null; }
}

function startNavigation(id) {
  const f = FACILITIES.find(x=>x.id===id);
  if(!f) return;
  const url = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}&travelmode=driving`;
  window.open(url, '_blank');
}

function callFacility(phone) {
  window.location.href = `tel:${phone}`;
}

// ══ LAYER TOGGLES (Visual only in this prototype) ══
function toggleLayer(layer, el) {
  el.classList.toggle('on');
}

function resetView() {
  clearRoute();
  map.setView([28.5700, 77.2100], 12);
}

// ══ SEARCH ══
document.getElementById('search-input').addEventListener('input', e=>{
  searchQuery = e.target.value.toLowerCase().trim();
  renderFacilityList();
});

// ══ INIT ══
window.addEventListener('DOMContentLoaded', async ()=>{
  try {
    await loadFacilitiesFromApi();
  } catch (error) {
    console.error('Using fallback data. API fetch failed:', error);
  }

  rebuildMobileOffsets();
  initMap();
  renderFacilityList();
  // Auto-locate after small delay
  setTimeout(()=>locateUser(), 800);
});
</script>
</body>
</html>
